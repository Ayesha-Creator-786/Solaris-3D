{% extends 'base.html' %}
{% block title %}SolarIQ - Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="glass-card p-5">
            <div class="text-center mb-5">
                <i class="fa-solid fa-circle-radiation text-warning fs-1 mb-3 animate-pulse"></i>
                <h2 class="fw-bold mb-2">Welcome Back</h2>
                <p class="text-muted">Sign in to your SolarIQ energy console</p>
            </div>

            <form action="{{ url_for('auth.login') }}" method="POST">
                <div class="mb-4">
                    <label for="email" class="form-label">Email address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary text-muted"><i
                                class="fa-regular fa-envelope"></i></span>
                        <input type="email" class="form-control border-start-0 border-secondary text-white" id="email"
                            name="email" required placeholder="name@domain.com">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary text-muted"><i
                                class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control border-start-0 border-secondary text-white"
                            id="password" name="password" required placeholder="••••••••">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input bg-transparent border-secondary" id="remember"
                            name="remember">
                        <label class="form-check-label text-muted" for="remember">Remember me</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-premium-primary w-100 py-3 mb-4">Sign In</button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}"
                        class="text-warning text-decoration-none fw-bold">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
