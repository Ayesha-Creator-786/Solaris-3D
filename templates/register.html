{% extends 'base.html' %}
{% block title %}SolarIQ - Register{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="glass-card p-5">
            <div class="text-center mb-5">
                <i class="fa-solid fa-circle-radiation text-warning fs-1 mb-3"></i>
                <h2 class="fw-bold mb-2">Create Account</h2>
                <p class="text-muted">Register to predict solar yields and manage energy loads</p>
            </div>

            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary text-muted"><i
                                class="fa-regular fa-user"></i></span>
                        <input type="text" class="form-control border-start-0 border-secondary text-white" id="name"
                            name="name" required placeholder="John Doe">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary text-muted"><i
                                class="fa-regular fa-envelope"></i></span>
                        <input type="email" class="form-control border-start-0 border-secondary text-white" id="email"
                            name="email" required placeholder="john@example.com">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Account Role</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary text-muted"><i
                                class="fa-solid fa-user-gear"></i></span>
                        <select class="form-select border-start-0 border-secondary text-white bg-dark-glass" id="role"
                            name="role">
                            <option value="user" selected>General Solar User</option>
                            <option value="admin">Platform Administrator</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary text-muted"><i
                                class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control border-start-0 border-secondary text-white"
                            id="password" name="password" required placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn btn-premium-primary w-100 py-3 mb-4">Create Account</button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted mb-0">Already have an account? <a href="{{ url_for('auth.login') }}"
                        class="text-warning text-decoration-none fw-bold">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
